# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 39 billable min per push across 2 jobs (37.4 min actual wall time),
# measured 2026-09-07 from run 34122830821. Most expensive jobs:
#    35 min  test (3.12)  (34.4 min wall)
#     4 min  test (3.11)  (3.0 min wall)
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes exceed wall time — many short jobs cost more than one long
# one. This number is measured, never estimated; re-measure after any change:
#   gh api repos/mcp-tool-shop-org/star-freight/actions/runs/<id>/jobs
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui]"

      # SKILL item 7: a full-suite re-run is a rig ritual, not a CI shape. On 3.12
      # the coverage step below runs THIS EXACT SUITE again, so running it plain
      # here too was 2.8 min of pure duplication every push. 3.11 still runs it.
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: |
          python -m pytest tests/ -x -q --ignore=tests/test_tui_voyage_legacy.py

      # COVERAGE_CORE=sysmon puts coverage.py on PEP 669 sys.monitoring, which
      # 3.12 supports. Measured 2026-09-07 (run 34122830821): this step took
      # 31.3 min against 2.8 min for the same suite uninstrumented - an 11x
      # tracing tax that made one job 35 of this workflow's 39 billable minutes.
      # No --cov-branch here and no --cov-fail-under, so the faster core changes
      # cost, not verdicts. Ignored outright by coverage < 7.4.
      - name: Run tests with coverage (3.12 only)
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_CORE: sysmon
        run: |
          python -m pytest tests/ --cov=src/portlight --cov-report=xml --ignore=tests/test_tui_voyage_legacy.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: Maritime term guard
        run: |
          python -m pytest tests/test_maritime_guard.py -v
